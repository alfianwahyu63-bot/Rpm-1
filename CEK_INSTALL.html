<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Instalasi RPM Cloudflare</title><style>body{font:16px system-ui;background:#101b37;color:#e8eeff;max-width:740px;padding:22px;margin:auto}h1{font-size:24px}p{color:#b9c6dc;line-height:1.55}.item{background:#1b2a45;border:1px solid #354767;padding:14px;margin:12px 0;border-radius:13px;overflow-wrap:anywhere}strong{display:block;margin-bottom:6px}small{display:block;color:#bdd1ea;margin-top:5px}a,button{color:#ffffff}button{background:#5b4be3;border:0;border-radius:9px;padding:13px 19px;font-weight:bold}a{display:inline-block;margin:10px} .good{color:#58e1a6}.bad{color:#ff858a}.warn{color:#ffd583}</style></head><body><h1>🔎 Cek Instalasi MonitoringRPM</h1><p>Periksa di <b>alamat Cloudflare</b> yang sama dengan dashboard, bukan di GitHub Pages. Status hijau untuk berkas belum menjamin Chrome akan menginstal aplikasi, tetapi membantu menemukan file hilang.</p><button id="run">Periksa ulang</button><a href="./index.html">Buka dashboard</a><div id="list" aria-live="polite">Menjalankan pemeriksaan…</div><script>
const list=document.getElementById('list');
function row(name,msg,ok){const e=document.createElement('div');e.className='item';e.innerHTML='<strong>'+name+'</strong>';const p=document.createElement('span');p.className=ok===true?'good':ok===false?'bad':'warn';p.textContent=msg;e.append(p);list.append(e)};
async function check(){list.replaceChildren();row('Alamat',location.href,location.protocol==='https:');
for (const file of ['./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png','./icon-maskable-512.png','./sw.js']){
try{const r=await fetch(file+'?pwaCheck='+Date.now(),{cache:'no-store'});let msg='HTTP '+r.status+' · '+r.headers.get('content-type');if(file.endsWith('png')&&r.ok){const b=await r.blob();const im=await createImageBitmap(b);msg+=' · '+im.width+'×'+im.height;im.close()}row(file,msg,r.ok&&((!file.endsWith('png'))||msg.includes('×')))}catch(e){row(file,e.message,false)}}
try{const res=await fetch('./manifest.webmanifest?v='+Date.now(),{cache:'no-store'});const m=await res.json();const start=new URL(m.start_url, res.url);const scope=new URL(m.scope,res.url);const id=new URL(m.id||m.start_url,start.href);const good=start.origin===location.origin&&scope.origin===location.origin&&start.pathname.startsWith(scope.pathname)&&['standalone','fullscreen','minimal-ui'].includes(m.display)&&!!m.name&&Array.isArray(m.icons)&&m.icons.length>0;row('Manifest: display, id, start_url, scope',`display=${m.display}; id=${id.pathname}; start=${start.pathname}; scope=${scope.pathname}`,good)}catch(e){row('Isi manifest','Gagal: '+e.message,false)}
row('Status service worker',('serviceWorker' in navigator)?((navigator.serviceWorker.controller?'Mengontrol halaman saat ini':'Terdaftar atau perlu reload (periksa dari dashboard)')):'Tidak didukung', 'serviceWorker' in navigator);
row('Status aplikasi terpasang',matchMedia('(display-mode:standalone)').matches?'Sedang dibuka sebagai aplikasi terpasang':'Masih di browser — bukan tanda kesalahan konfigurasi',null);
}
document.getElementById('run').addEventListener('click',check);check();
</script></body></html>
