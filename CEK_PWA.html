<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek RPM PWA</title>
<style>body{font-family:system-ui,sans-serif;background:#09152b;color:#f1f5ff;padding:25px;max-width:720px;margin:auto}h1{font-size:27px}.box{margin:12px 0;padding:18px;border:1px solid #344760;border-radius:16px;background:#16243d;line-height:1.65}.ok{border-left:5px solid #28c883}.fail{border-left:5px solid #ff5e71}.warn{border-left:5px solid #ffb85d}a{color:#69d4ff}button{padding:12px 18px;background:#39a3ef;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}</style>
</head><body><h1>🔍 Pemeriksaan PWA RPM-1</h1><p>Memeriksa format yang sama dengan paket Klerek-Kasir (manifest relatif, folder icons/, service worker). Indikator ini bukan jaminan instalasi Android.</p><div id="out"></div><button onclick="location.reload()">Periksa ulang</button> <a href="./index.html">Buka dashboard</a>
<script>
const out=document.getElementById('out');
function box(t,m,st){const e=document.createElement('div');e.className='box '+st;e.innerHTML='<strong>'+t+'</strong><br>'+m;out.appendChild(e)}
const allowed=['./index.html','./style.css','./app.js','./sw.js','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png','./icons/icon-maskable-512.png','./icons/apple-touch-icon.png'];
(async()=>{
 box('HTTPS / localhost',location.protocol==='https:'?'✅ HTTPS tersedia':'⚠ Bukan HTTPS. Hosting GitHub Pages harus HTTPS.',location.protocol==='https:'?'ok':'warn');
 for(const file of allowed){try{let res=await fetch(file,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status); let note='HTTP '+res.status+' · '+(res.headers.get('content-type')||'');if(file.endsWith('.png')) {let blob=await res.blob();let bm=await createImageBitmap(blob);note+=' · '+bm.width+'×'+bm.height;bm.close();} box(file,'✅ '+note,'ok')}catch(err){box(file,'❌ '+err.message,'fail')}}
 try{let m=await (await fetch('./manifest.webmanifest',{cache:'no-store'})).json(); const base=new URL('./',location.href),url=new URL(m.start_url,new URL('./manifest.webmanifest',location.href));const good=m.display==='standalone' && url.pathname.startsWith(base.pathname)&&m.icons.some(i=>i.sizes==='192x192')&&m.icons.some(i=>i.sizes==='512x512');box('Manifest dan jalur instalasi', (good?'✅ ':'⚠ ')+'display: '+m.display+'; start_url: '+url.pathname+'; scope: '+m.scope+'; id: '+m.id,good?'ok':'warn')}catch(e){box('Manifest','❌ '+e.message,'fail')}
 if('serviceWorker' in navigator){try{let reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});box('Service Worker','✅ Terdaftar dengan scope: '+reg.scope,'ok')}catch(e){box('Service Worker','❌ '+e.message,'fail')}}else box('Service Worker','❌ Browser tidak mendukung SW','fail');
 box('Mode aplikasi',matchMedia('(display-mode: standalone)').matches?'✅ Sudah dibuka sebagai aplikasi':'ℹ Dibuka melalui browser. Ini normal sebelum instalasi.',matchMedia('(display-mode: standalone)').matches?'ok':'warn');
})();
</script></body></html>
